name: card_index
description: StS2 card index database app.
publish_to: 'none'

version: 0.3.3+28

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  uuid: ^4.3.3
  path_provider: ^2.1.2
  share_plus: ^10.0.0
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/app_logo.png" # 아이콘으로 쓸 이미지 파일명/경로
  adaptive_icon_background: "#121212"    # 아이콘 배경색 (다크 테마에 맞는 색)
  adaptive_icon_foreground: "assets/icons/app_logo.png" # 전경 이미지

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/
    - assets/cards/
    - assets/data/default_database.json

  fonts:
    - family: GyeonggiBatang
      fonts:
        - asset: assets/fonts/경기천년바탕_Bold.ttf